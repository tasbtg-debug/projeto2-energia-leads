<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Energia | Análise de perfil</title><style>
:root{font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:#26342c;background:#f7f8f7}*{box-sizing:border-box}body{margin:0}.wrap{max-width:690px;margin:34px auto;padding:0 18px}.head{background:#31b66b;color:white;border-radius:20px 20px 0 0;padding:30px}h1{margin:0 0 8px;font-size:clamp(23px,4vw,32px)}.head p{margin:0;opacity:.92;line-height:1.5}.panel{background:white;padding:28px;border:1px solid #e1e5e2;border-top:0;border-radius:0 0 20px 20px;box-shadow:0 15px 40px #31b66b0d}.step{font-size:13px;color:#59665d;font-weight:700}.track{height:7px;background:#f0f2f0;border-radius:9px;margin:10px 0 25px;overflow:hidden}.progress{height:100%;background:#31b66b;width:12.5%;transition:width .2s}.question{font-size:22px;font-weight:750;margin:0 0 20px}.input,select{width:100%;border:1px solid #cbd2cd;border-radius:10px;padding:14px;font-size:17px;background:white;color:#25372b}.options{display:grid;gap:10px}.option{border:1px solid #d9dfdb;border-radius:12px;padding:15px;display:flex;gap:12px;cursor:pointer;align-items:center}.option:has(input:checked){border-color:#31b66b;background:#eef9f1}.option input{accent-color:#31b66b}.actions{display:flex;gap:12px;margin-top:28px}.btn{background:#31b66b;color:white;border:0;border-radius:11px;padding:15px 20px;font-weight:700;cursor:pointer;flex:1;font-size:15px}.btn:disabled{opacity:.55;cursor:wait}.secondary{background:#f0f2f0;color:#34483a;flex:0 0 auto}.error{color:#a52222;margin-top:12px;min-height:22px}.note{font-size:13px;color:#627168;line-height:1.5}.hidden{display:none}.review{line-height:1.9;overflow-wrap:anywhere}.review strong{display:inline-block;min-width:170px}.consent{display:flex;gap:10px;align-items:flex-start;margin-top:18px;font-size:14px}.success{padding:15px;background:#eef9f1;border-radius:12px;margin-top:18px}a.btn{display:block;text-align:center;text-decoration:none;margin-top:15px}.hp{position:absolute;left:-9999px}@media(max-width:480px){.wrap{margin:0;padding:0}.head{border-radius:0}.panel{border-radius:0;padding:20px}.question{font-size:20px}}.upload{margin-top:22px;padding:18px;border:1px dashed #31b66b;border-radius:12px;background:#f7f8f7}.upload label{display:block;font-weight:700;margin-bottom:9px}.upload input{width:100%;max-width:100%}.upload small{display:block;margin-top:8px;color:#59665d}.btn{color:#102819}.option:has(input:checked){border-width:2px}
</style></head><body><div class="wrap"><header class="head"><h1>Descubra como economizar até 20% na sua conta de energia</h1><p>Preencha e descubra quanto você pode economizar todos os meses.</p></header><main class="panel"><div id="formview"><div class="step" id="stepText"></div><div class="track"><div class="progress" id="progress"></div></div><h2 class="question" id="question"></h2><div id="field"></div><div class="actions"><button type="button" id="back" class="btn secondary">Voltar</button><button type="button" id="next" class="btn">Continuar</button></div><div id="error" class="error" role="alert"></div></div><div id="done" class="hidden"><h2>Solicitação preparada</h2><p id="doneText"></p><a id="whatsappLink" class="btn" target="_self" rel="noopener">Abrir conversa no WhatsApp</a><p class="note">O WhatsApp abrirá com a mensagem pronta. Confirme o envio dentro do aplicativo ou WhatsApp Web.</p></div></main></div><script>
const destination='5531984919022';
const steps=[
 {key:'name',q:'Como podemos te chamar?',type:'text',placeholder:'Digite seu nome'},
 {key:'whatsapp',q:'Qual é o seu WhatsApp?',type:'tel',placeholder:'(00) 00000-0000'},
 {key:'bill_range',q:'Quanto você paga em média na conta de energia?',options:['Até R$ 150','R$ 150 a R$ 300','R$ 300 a R$ 600','Acima de R$ 600','Não pago energia','Tenho placa']},
 {key:'benefit',q:'Você participa de algum programa de benefício social na conta de energia?',options:['Não participo','Sim, participo de tarifa social ou baixa renda']},
 {key:'property_type',q:'Qual é o tipo do seu imóvel?',options:['Casa','Apartamento','Comércio','Empresa','Outros']},
 {key:'ownership',q:'O imóvel é:',options:['Próprio','Alugado']},
 {key:'state',q:'Em qual estado fica o imóvel?',options:['AC','AL','AP','AM','BA','CE','DF','ES','GO','MA','MT','MS','MG','PA','PB','PR','PE','PI','RJ','RN','RS','RO','RR','SC','SP','SE','TO'],select:true},
 {key:'bill_holder',q:'A conta de energia está no seu nome?',options:['Sim.','Não, proprietário do imóvel.','Não, parente ou familiar.']}
];
let step=0;const data={};let consent=false;const el=id=>document.getElementById(id);const escapeHTML=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function render(){const review=step===steps.length;el('stepText').textContent=review?'Revisão final':`Etapa ${step+1} de ${steps.length}`;el('progress').style.width=`${((step+1)/(steps.length+1))*100}%`;el('question').textContent=review?'Confira seus dados antes de enviar':steps[step].q;el('back').style.display=step===0?'none':'';el('next').textContent=review?'Finalizar e enviar pelo WhatsApp':'Continuar';el('error').textContent='';
 if(review){el('field').innerHTML='<div class="review">'+steps.map(s=>`<div><strong>${escapeHTML(s.q)}</strong> ${escapeHTML(data[s.key]||'—')}</div>`).join('')+'</div><div class="upload"><label for="billFile">Anexe sua conta de energia (opcional)</label><input type="file" id="billFile" accept="image/jpeg,image/png,image/webp,application/pdf"><small>Foto ou PDF de até 4 MB. Não inclua documentos desnecessários.</small></div><label class="consent"><input id="consent" type="checkbox" '+(consent?'checked':'')+'><span>Autorizo o uso dos meus dados para análise do perfil de energia e contato comercial via WhatsApp, conforme a <a href="/privacidade.html" target="_blank">Política de Privacidade</a>.</span></label><input class="hp" id="website" autocomplete="off" tabindex="-1">';el('consent').addEventListener('change',e=>consent=e.target.checked);return;}
 const s=steps[step];if(s.options){if(s.select){el('field').innerHTML='<select id="answer"><option value="">Selecione o estado</option>'+s.options.map(v=>`<option value="${escapeHTML(v)}" ${data[s.key]===v?'selected':''}>${escapeHTML(v)}</option>`).join('')+'</select>';}else{el('field').innerHTML='<div class="options">'+s.options.map(v=>`<label class="option"><input type="radio" name="answer" value="${escapeHTML(v)}" ${data[s.key]===v?'checked':''}><span>${escapeHTML(v)}</span></label>`).join('')+'</div>';}}else{el('field').innerHTML=`<input class="input" id="answer" type="${s.type}" placeholder="${s.placeholder}" maxlength="120" value="${escapeHTML(data[s.key]||'')}">`;}}
function read(){const s=steps[step];const node=s.options&&!s.select?document.querySelector('input[name="answer"]:checked'):el('answer');const value=node?.value?.trim()||'';if(!value){el('error').textContent='Selecione ou preencha uma resposta para continuar.';return false;}if(s.key==='name'&&value.length<2){el('error').textContent='Informe seu nome.';return false;}if(s.key==='whatsapp'&&!/^\d{10,13}$/.test(value.replace(/\D/g,''))){el('error').textContent='Informe um WhatsApp com DDD válido.';return false;}data[s.key]=value;return true;}
function message(id,fileUrl){return `⚡ NOVA ANÁLISE DA CONTA DE ENERGIA\n\nProtocolo: ${id??'Não registrado'}\nNome: ${data.name}\nWhatsApp: ${data.whatsapp}\nTipo de imóvel: ${data.property_type}\nSituação do imóvel: ${data.ownership}\nEstado: ${data.state}\nConta média: ${data.bill_range}\nBenefício social: ${data.benefit}\nConta no próprio nome: ${data.bill_holder}\nFatura: ${fileUrl||'Não anexada'}\n\nSolicitação de análise de perfil.`;}
function link(id,fileUrl){return `https://wa.me/${destination}?text=${encodeURIComponent(message(id,fileUrl))}`;}
async function submit(){
 if(!consent){el('error').textContent='É necessário aceitar a política de privacidade.';return;}
 const file=el('billFile')?.files?.[0];let attachment=null;
 if(file){
  const allowed=['image/jpeg','image/png','image/webp','application/pdf'];
  if(!allowed.includes(file.type)||file.size>4*1024*1024){el('error').textContent='Envie JPG, PNG, WEBP ou PDF com até 4 MB.';return;}
  try{attachment=await new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve({name:file.name,type:file.type,base64:String(reader.result).split(',')[1]});reader.onerror=reject;reader.readAsDataURL(file);});}
  catch{el('error').textContent='Não foi possível ler o arquivo.';return;}
 }
 const button=el('next');button.disabled=true;button.textContent='Registrando...';el('error').textContent='';
 try{
  const r=await fetch('/api/leads',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({...data,consent:true,attachment,website:el('website')?.value||''})});
  const result=await r.json();if(!r.ok||!result.ok)throw new Error(result.error||'Falha ao registrar');
  const url=link(result.protocol,result.bill_url);el('formview').classList.add('hidden');el('done').classList.remove('hidden');
  el('whatsappLink').href=url;el('doneText').textContent='Cadastro registrado. Envie a mensagem pronta à equipe pelo WhatsApp.';window.location.assign(url);
 }catch(err){el('error').textContent='Não foi possível salvar sua solicitação. Tente novamente. '+(err.message||'');button.disabled=false;button.textContent='Finalizar e enviar pelo WhatsApp';}
}
el('next').addEventListener('click',()=>{if(step===steps.length){submit();return;}if(read()){step++;render();}});el('back').addEventListener('click',()=>{if(step>0){step--;render();}});render();
</script></body></html>
